name: G2 Lean Proof Gate

on:
  push:
    branches: ["main", "rei-g2-proof"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Lean 4.32.2 and generate Lake manifest
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.32.2
          elan override set leanprover/lean4:v4.32.2
          lean --version
          lake --version
          lake update

      - name: Build and independently recheck Lean declarations
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
          use-github-cache: false

      - name: Direct trust-zero elaboration
        run: lake env lean --trust=0 REI_Omega_G2_Critical_Invariants.lean

      - name: Fresh Lean kernel replay
        run: lake env leanchecker --fresh REI_Omega_G2_Critical_Invariants
