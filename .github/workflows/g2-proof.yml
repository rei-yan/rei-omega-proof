name: G2 Lean Proof Gate

on:
  push:
    branches: ["main", "rei-g2-proof"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Lean 4.32.2 and generate Lake manifest
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.32.2
          elan override set leanprover/lean4:v4.32.2
          lean --version
          lake --version
          lake update

      - name: Build and Lean-kernel replay
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          leanchecker: true
          nanoda: false
          use-github-cache: false

      - name: Direct trust-zero elaboration
        run: lake env lean --trust=0 Rei_omega_proof.lean

      - name: Fresh Lean kernel replay
        run: lake env leanchecker --fresh Rei_omega_proof

      - name: External nanoda type check with explicit root module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _lean4export _nanoda_lib _nanoda_export.txt _nanoda_config.json

          git clone --depth 1 https://github.com/leanprover/lean4export.git _lean4export
          cp lean-toolchain _lean4export/
          (cd _lean4export && lake build)

          git clone --depth 1 --branch debug https://github.com/ammkrn/nanoda_lib.git _nanoda_lib
          (cd _nanoda_lib && cargo build --release)

          lake env _lean4export/.lake/build/bin/lean4export Rei_omega_proof > _nanoda_export.txt

          cat > _nanoda_config.json <<'EOF'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "Lean.trustCompiler"],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          EOF

          _nanoda_lib/target/release/nanoda_bin _nanoda_config.json
