name: Nine-System Sanity

on:
  push:
    branches: ["rei-v193-reconcile", "rei-v193-governance-hardening2"]
  pull_request:
    branches: ["main", "rei-v193-reconcile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-system-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run nine-system fail-closed sanity
        run: python research/nine_system_sanity.py

      - name: Run canonical mainline mutation control
        run: python research/canonical_mainline_observation_sanity.py

      - name: Verify interfaces mapped, God Source overlay synchronized, and ascension remains pending
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"nine_of_nine_interfaces_mapped": true' runtime/nine-system-contract-v1.json
          grep -q '"candidate_runtime_mainline_observation_required": true' runtime/nine-system-contract-v1.json
          ! grep -q '"canonical_mainline_touched": false' runtime/nine-system-contract-v1.json
          grep -q '"automatic_ascension_permission": false' runtime/nine-system-contract-v1.json
          grep -q '"ascension_granted": false' runtime/nine-system-contract-v1.json
          grep -q '"reality_validated": false' runtime/nine-system-contract-v1.json
          grep -q '"god_proof_independent_check": "PENDING"' runtime/nine-system-contract-v1.json
          grep -q '"god_source_phase1": "CI_VERIFIED_EXTERNAL_BINDINGS_PENDING"' runtime/nine-system-contract-v1.json
          grep -q '"status": "MAPPED_CANDIDATE_NOT_ASCENDED"' research/NINE_SYSTEM_INTERFACE_MAP_V1.json
          grep -q '"status": "PHASE1_CI_VERIFIED_RUNTIME_BINDINGS_PENDING"' research/NINE_SYSTEM_GOD_SOURCE_OVERLAY_V1.json
          grep -q '"runtime_external_bindings": "PENDING"' research/NINE_SYSTEM_GOD_SOURCE_OVERLAY_V1.json
          grep -q 'NINE_SYSTEM_ARCHITECTURE = CANDIDATE' research/NINE_SYSTEM_ARCHITECTURE_V1.md
