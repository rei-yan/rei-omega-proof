name: Multi-Lineage Coevolution Sanity

on:
  pull_request:
    paths:
      - 'research/MULTILINEAGE_COEVOLUTION_KERNEL.md'
      - 'research/multilineage_coevolution_sanity.py'
      - '.github/workflows/multilineage-coevolution-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multilineage-coevolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded Multi-Lineage Coevolution sanity suite
        run: python research/multilineage_coevolution_sanity.py
