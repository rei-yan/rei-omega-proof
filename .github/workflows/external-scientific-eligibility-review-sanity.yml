name: External Scientific Eligibility Review Sanity

on:
  pull_request:
    paths:
      - 'research/EXTERNAL_SCIENTIFIC_ELIGIBILITY_REVIEW.md'
      - 'research/external_scientific_eligibility_review.py'
      - 'research/external_scientific_eligibility_review_request.example.json'
      - 'research/external_scientific_eligibility_review_sanity.py'
      - 'research/external_scientific_eligibility_reviews/README.md'
      - '.github/workflows/external-scientific-eligibility-review-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review request example JSON
        run: python -m json.tool research/external_scientific_eligibility_review_request.example.json >/dev/null
      - name: Run external eligibility review sanity crucible
        run: python research/external_scientific_eligibility_review_sanity.py
      - name: Anti-self-certification assertions
        run: |
          grep -q 'Internal code stops at' research/EXTERNAL_SCIENTIFIC_ELIGIBILITY_REVIEW.md
          grep -q 'SELF_REVIEW_FORBIDDEN' research/EXTERNAL_SCIENTIFIC_ELIGIBILITY_REVIEW.md
          grep -q 'GreenCI != ExternalEligibility' research/EXTERNAL_SCIENTIFIC_ELIGIBILITY_REVIEW.md
          grep -q 'RealWorldActuationAuthority = 0' research/EXTERNAL_SCIENTIFIC_ELIGIBILITY_REVIEW.md
