name: Nine-System God Proof Gate

on:
  push:
    branches: ["rei-v193-reconcile"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  god-proof-preascension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run God Proof internal precheck
        run: python research/nine_system_god_proof_gate.py

      - name: Assert external blockers and self-ascension lock remain visible
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"god_proof_independent_check": "PENDING"' runtime/nine-system-contract-v1.json
          grep -q '"reality_validated": false' runtime/nine-system-contract-v1.json
          grep -q '"ascension_granted": false' runtime/nine-system-contract-v1.json
          grep -q '"automatic_ascension_permission": false' runtime/nine-system-contract-v1.json
          grep -q 'Unified GPT/Claude/local source registry is not yet implemented' research/NINE_SYSTEM_INTERFACE_MAP_V1.json
          grep -q 'Independent external validation remains open' research/NINE_SYSTEM_INTERFACE_MAP_V1.json
