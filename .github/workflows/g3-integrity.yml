name: G3 Challenge Integrity

on:
  push:
    branches: ["main", "rei-g3-replication", "rei-g3-challenge-hash-lock"]
    paths:
      - "g3/**"
      - ".github/workflows/g3-integrity.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "g3/**"
      - ".github/workflows/g3-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g3-public-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate frozen challenge
        run: python3 g3/make_challenge.py > challenge.jsonl

      - name: Verify case count and committed digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < challenge.jsonl)" -eq 25000
          ACTUAL="$(sha256sum challenge.jsonl | awk '{print $1}')"
          EXPECTED="fa81bf4e184037dfff6fea7357444cf519d6cd6a7d65d48a5cd90ed6afb9b47e"
          echo "challenge_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Exercise public shape validator and challenge hash lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > shape-only-submission.jsonl
          import json

          output_key = {
              "gate": "execute",
              "authority": "monotone",
              "upgrade": "accepted",
          }

          with open("challenge.jsonl", "r", encoding="utf-8") as source:
              for line in source:
                  row = json.loads(line)
                  out = {"id": row["id"], output_key[row["type"]]: False}
                  print(json.dumps(out, sort_keys=True, separators=(",", ":")))
          PY

          python3 g3/validate_submission_shape.py challenge.jsonl shape-only-submission.jsonl

          python3 - <<'PY'
          import json

          with open("challenge.jsonl", "r", encoding="utf-8") as source:
              rows = source.readlines()

          first = json.loads(rows[0])
          first["authorized"] = not first["authorized"]
          rows[0] = json.dumps(first, sort_keys=True, separators=(",", ":")) + "\n"

          with open("tampered-challenge.jsonl", "w", encoding="utf-8") as target:
              target.writelines(rows)
          PY

          if python3 g3/validate_submission_shape.py tampered-challenge.jsonl shape-only-submission.jsonl; then
            echo "tampered challenge unexpectedly passed validation" >&2
            exit 1
          fi

      - name: Syntax-check public validator
        run: python3 -m py_compile g3/validate_submission_shape.py

      - name: Assert sealed oracle is not public
        shell: bash
        run: |
          set -euo pipefail
          if find g3 -maxdepth 2 -type f -iname '*oracle*' | grep -v 'CHALLENGE_COMMITMENTS.md' | grep -q .; then
            echo "A file with oracle in its name is present in public g3 tree" >&2
            exit 1
          fi
