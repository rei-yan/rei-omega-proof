name: Ohmic Constraint Sanity

on:
  push:
    branches: ["main", "rei-ohmic-layer"]
    paths:
      - "research/OHMIC_CONSTRAINT_LAYER.md"
      - "research/ohmic_sanity.py"
      - ".github/workflows/ohmic-sanity.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/OHMIC_CONSTRAINT_LAYER.md"
      - "research/ohmic_sanity.py"
      - ".github/workflows/ohmic-sanity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic Ohmic checks
        run: python3 research/ohmic_sanity.py
